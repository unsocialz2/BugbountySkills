name: Repair OpenCode skills

on:
  push:
    branches:
      - repair/opencode-skills-clean
    paths:
      - .github/workflows/audit-opencode-skills.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only missing files referenced by skills
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream
          git clone --quiet https://github.com/0xN0RMXL/BugBountySkills.git /tmp/upstream
          git -C /tmp/upstream checkout --quiet 0accf5fdc71ec7f03273aebb99268a8609f8dfd4

          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('.opencode/skills')
          upstream = Path('/tmp/upstream')
          src_rx = re.compile(r'(?<![A-Za-z0-9_./-])(SKILL_FILES/[A-Za-z0-9_.+ /-]+?\.(?:md|txt|py|sh|yaml|yml|json))')
          rel_rx = re.compile(r'(?<![A-Za-z0-9_./-])(references/[A-Za-z0-9_.+ /-]+?\.(?:md|txt|py|sh|yaml|yml|json))')

          restored = []
          unresolved = set()

          # One actual deleted local reference identified in the original repo.
          payload_dst = root / 'payloads/references/6-rce-command-injection-by-language.md'
          payload_src = upstream / 'SKILL_FILES/PAYLOADS/rce_payloads_all_langs.md'
          if not payload_dst.exists():
              if not payload_src.exists():
                  unresolved.add(('.opencode/skills/payloads/SKILL.md', 'references/6-rce-command-injection-by-language.md', 'missing upstream source'))
              else:
                  payload_dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(payload_src, payload_dst)
                  restored.append((str(payload_dst), 'SKILL_FILES/PAYLOADS/rce_payloads_all_langs.md'))

          # Resolve SKILL_FILES dependencies to a fixed point. Newly restored source
          # docs can themselves reference additional SKILL_FILES files.
          round_no = 0
          while True:
              round_no += 1
              added = 0
              for f in sorted(root.rglob('*.md')):
                  skill_root = root / f.parts[2]
                  text = f.read_text(encoding='utf-8', errors='replace')
                  for ref in sorted(set(src_rx.findall(text))):
                      ref = ref.strip()
                      dst = skill_root / ref
                      if dst.exists():
                          continue
                      src = upstream / ref
                      if not src.exists():
                          unresolved.add((str(f), ref, 'missing upstream source'))
                          continue
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                      restored.append((str(dst), ref))
                      added += 1
              print(f'RESTORE_ROUND={round_no} ADDED={added}')
              if added == 0:
                  break
              if round_no > 20:
                  raise SystemExit('dependency expansion exceeded 20 rounds')

          if unresolved:
              for row in sorted(unresolved):
                  print('UNRESOLVED | ' + ' | '.join(row))
              raise SystemExit(2)

          # Final integrity audit relative to each owning skill.
          missing = []
          for f in sorted(root.rglob('*.md')):
              skill_root = root / f.parts[2]
              text = f.read_text(encoding='utf-8', errors='replace')
              for ref in sorted(set(rel_rx.findall(text))):
                  ref = ref.strip()
                  if not (skill_root / ref).exists():
                      missing.append((str(f), ref))
              for ref in sorted(set(src_rx.findall(text))):
                  ref = ref.strip()
                  if not (skill_root / ref).exists():
                      missing.append((str(f), ref))

          print(f'RESTORED_COUNT={len(restored)}')
          print(f'FINAL_MISSING_COUNT={len(missing)}')
          for owner, ref in missing:
              print(f'MISSING | {owner} | {ref}')
          if missing:
              raise SystemExit(3)
          PY

      - name: Commit only OpenCode skill repairs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .opencode/skills)" ]; then
            echo 'No skill repairs needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .opencode/skills
          git commit -m 'fix: restore missing OpenCode skill support files'
          git push origin HEAD:repair/opencode-skills-clean
