name: Audit repaired BugBountySkills references

on:
  push:
    branches:
      - repair/restore-missing-skills-20261014

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find unresolved support references and their owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import glob, re
          prefixes = ('SKILL_FILES', 'CHECKLISTS', 'KNOWLEDGE_BASE', 'REFERENCE', 'SAMPLES', 'scripts')
          patterns = [
              re.compile(r'\((?P<p>(?:SKILL_FILES|CHECKLISTS|KNOWLEDGE_BASE|REFERENCE|SAMPLES|scripts)/[^)]+)\)'),
              re.compile(r'(?P<p>(?:SKILL_FILES|CHECKLISTS|KNOWLEDGE_BASE|REFERENCE|SAMPLES|scripts)/[^\s`"\']+)')
          ]
          owners = {}
          for md in Path('.opencode/skills').rglob('*.md'):
              text = md.read_text(encoding='utf-8', errors='replace')
              for rx in patterns:
                  for m in rx.finditer(text):
                      ref = m.group('p').strip().rstrip('.,;:)')
                      owners.setdefault(ref, set()).add(str(md))
          missing=[]
          for ref in sorted(owners):
              exists = bool(glob.glob(ref)) if any(c in ref for c in '*?[') else Path(ref).exists()
              if not exists:
                  missing.append(ref)
                  print('MISSING_REF=' + ref)
                  for owner in sorted(owners[ref]): print('  OWNER=' + owner)
          print('REF_AUDIT_TOTAL=' + str(len(owners)))
          print('REF_AUDIT_MISSING=' + str(len(missing)))
          if missing: raise SystemExit(2)
          PY
